name: Onboard user

on:
  issues:
    types: [labeled]

jobs:
  onboard:
    if: github.event.label.name == 'approved'
    runs-on: onprem-onboarding
    permissions:
      issues: write

    steps:
      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            const email = body.match(/\*\*Email:\*\* (.+)/)?.[1]?.trim() ?? '';
            const rawGroups = body.match(/\*\*Groupes Entra ID:\*\* (.+)/)?.[1]?.trim() ?? '';
            const groups = rawGroups === 'Aucun (SSH uniquement)' ? '' : rawGroups;
            const keyMatch = body.match(/```\n((?:ssh-ed25519|ssh-rsa|ecdsa-sha2-nistp256) \S+[^\n]*)\n```/);
            const pubkey = keyMatch?.[1]?.trim() ?? '';

            if (!email || !pubkey) {
              core.setFailed("Impossible de parser email ou clé SSH dans l'issue.");
            }

            core.setOutput('email', email);
            core.setOutput('groups', groups);
            core.setOutput('pubkey', pubkey);

      - name: Checkout infra-datacenter-docs
        uses: actions/checkout@v4
        with:
          repository: soma-smart/infra-datacenter-docs
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: infra

      - name: Configure git
        run: |
          git -C infra config user.name "onboarding-bot"
          git -C infra config user.email "bot@soma-smart.com"

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.ONBOARD_SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H 10.0.30.200 10.0.30.201 10.0.30.202 >> ~/.ssh/known_hosts

      - name: Azure login
        if: steps.parse.outputs.groups != ''
        run: |
          az login --service-principal \
            --username "${{ secrets.AZURE_CLIENT_ID }}" \
            --password "${{ secrets.AZURE_CLIENT_SECRET }}" \
            --tenant "${{ secrets.AZURE_TENANT_ID }}" \
            --allow-no-subscriptions

      - name: Write public key to temp file
        run: printf '%s\n' "${{ steps.parse.outputs.pubkey }}" > /tmp/onboard_pubkey.pub

      - name: Run onboarding script
        working-directory: infra
        run: |
          EMAIL="${{ steps.parse.outputs.email }}"
          GROUPS="${{ steps.parse.outputs.groups }}"
          if [[ -z "${GROUPS}" ]]; then
            bash scripts/onboard-devops-user.sh "${EMAIL}" /tmp/onboard_pubkey.pub
          else
            IFS=', ' read -ra GROUP_LIST <<< "${GROUPS}"
            for GROUP in "${GROUP_LIST[@]}"; do
              bash scripts/onboard-devops-user.sh "${EMAIL}" /tmp/onboard_pubkey.pub "${GROUP}"
            done
          fi

      - name: Comment success on issue
        if: success()
        uses: actions/github-script@v7
        env:
          GROUPS: ${{ steps.parse.outputs.groups }}
        with:
          script: |
            const groups = process.env.GROUPS;
            const groupNote = groups
              ? ` + groupes Entra ID **${groups}** configurés — accès Rancher/kubectl disponible.`
              : '.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `✅ Onboarding terminé avec succès.\n\nAccès SSH propagé sur les 3 nœuds k3s${groupNote}`,
            });
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              state: 'closed',
              labels: ['onboarding', 'done'],
            });

      - name: Comment failure on issue
        if: failure()
        uses: actions/github-script@v7
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.issue.number,
              body: `❌ Onboarding échoué — voir les [logs du workflow](${process.env.RUN_URL}).`,
            });
